<svg xmlns="http://www.w3.org/2000/svg" width="920" height="660" viewBox="0 0 920 660" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b45309"/>
    </marker>
  </defs>

  <rect width="920" height="660" fill="#f8fafc"/>
  <text x="460" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">Conference Schedule Concierge — Architecture</text>
  <text x="460" y="62" text-anchor="middle" font-size="14" fill="#475569">Four layers. Dependencies point down. The agent reads the governed semantic layer at runtime — it holds no schedule structure.</text>

  <!-- question in / answer out -->
  <text x="150" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">user question</text>
  <line x1="150" y1="108" x2="150" y2="140" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="770" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">answer</text>
  <text x="770" y="117" text-anchor="middle" font-size="11" fill="#64748b">(sources cited · TBD flagged)</text>
  <line x1="770" y1="140" x2="770" y2="108" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- main.py -->
  <rect x="60" y="140" width="800" height="54" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="80" y="166" font-size="15" font-weight="700" fill="#0f172a">main.py</text>
  <text x="80" y="184" font-size="12.5" fill="#475569">CLI entry — hand the question to the agent, print the answer</text>

  <line x1="460" y1="194" x2="460" y2="222" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="470" y="212" font-size="11" fill="#64748b">build + ask</text>

  <!-- Layer 4 agent -->
  <rect x="60" y="222" width="800" height="64" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="80" y="247" font-size="13" font-weight="700" fill="#1d4ed8">LAYER 4</text>
  <text x="150" y="247" font-size="15" font-weight="700" fill="#0f172a">agent.py</text>
  <text x="80" y="268" font-size="12.5" fill="#334155">Strands Agent + SYSTEM_PROMPT (no source names, no columns, no join keys) + .env config</text>
  <text x="80" y="282" font-size="11.5" fill="#64748b">cost: model id is a swappable config value</text>

  <line x1="460" y1="286" x2="460" y2="314" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="470" y="304" font-size="11" fill="#64748b">agent calls two tools</text>

  <!-- Layer 3 orchestration -->
  <rect x="60" y="314" width="800" height="78" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="80" y="339" font-size="13" font-weight="700" fill="#6d28d9">LAYER 3</text>
  <text x="150" y="339" font-size="15" font-weight="700" fill="#0f172a">orchestration.py</text>
  <text x="80" y="360" font-size="12.5" fill="#334155">tools: get_semantic_layer()  ·  query_source()      join engine: enrich_sessions()</text>
  <text x="80" y="378" font-size="12.5" fill="#334155">inline guardrails: validate source id · cite source · flag TBD · never invent</text>

  <!-- down-left to semantic, down-right to data_platform -->
  <line x1="300" y1="392" x2="300" y2="432" stroke="#b45309" stroke-width="2.5" marker-end="url(#arrowAccent)"/>
  <text x="312" y="418" font-size="11" font-weight="600" fill="#b45309">reads at runtime</text>
  <line x1="650" y1="392" x2="650" y2="432" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="662" y="418" font-size="11" fill="#64748b">reads rows</text>

  <!-- Layer 2 semantic (governed) -->
  <rect x="60" y="432" width="440" height="150" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="80" y="457" font-size="13" font-weight="700" fill="#b45309">LAYER 2 · GOVERNED CONTENT (not code)</text>
  <text x="80" y="477" font-size="15" font-weight="700" fill="#0f172a">semantic/</text>
  <rect x="80" y="488" width="400" height="26" rx="4" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="92" y="505" font-size="12" fill="#334155"><tspan font-weight="700">sources.md</tspan>   — what sources exist</text>
  <rect x="80" y="518" width="400" height="26" rx="4" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="92" y="535" font-size="12" fill="#334155"><tspan font-weight="700">field_map.md</tspan>  — attendee words → columns</text>
  <rect x="80" y="548" width="400" height="26" rx="4" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="92" y="565" font-size="12" fill="#334155"><tspan font-weight="700">joins.md</tspan>   — join keys + correctness rules</text>

  <!-- Layer 1 data_platform -->
  <rect x="540" y="432" width="320" height="92" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="560" y="457" font-size="13" font-weight="700" fill="#15803d">LAYER 1</text>
  <text x="640" y="457" font-size="15" font-weight="700" fill="#0f172a">data_platform.py</text>
  <text x="560" y="479" font-size="12.5" fill="#334155">reusable + domain-agnostic:</text>
  <text x="560" y="496" font-size="12.5" fill="#334155">read a source's rows from CSV</text>
  <text x="560" y="513" font-size="11.5" fill="#64748b">(no conference words — any app can reuse it)</text>

  <!-- data csv -->
  <line x1="700" y1="524" x2="700" y2="556" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="600" y="556" width="200" height="44" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="700" y="582" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">data/*.csv  (synthetic)</text>

  <!-- the key callout -->
  <rect x="60" y="602" width="800" height="42" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
  <text x="460" y="620" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b45309">How the data relates lives in LAYER 2 (semantic/), governed and versioned — NOT in the agent's prompt.</text>
  <text x="460" y="637" text-anchor="middle" font-size="11.5" fill="#92400e">Add a track, room, or source by editing the layer + data. The agent code never changes.</text>
</svg>
